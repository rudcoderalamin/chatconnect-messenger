[build]
  publish = "frontend"

# Service worker must never be cached long-term, so updates roll out immediately
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Single-page app fallback (harmless here since this app has one HTML file,
# but keeps things future-proof if more routes/pages are added later)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
